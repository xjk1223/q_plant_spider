version: '3.8'

services:
  q-plant-spider:
    build: .
    container_name: q-plant-spider
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./downloaded_images:/app/downloaded_images
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
    networks:
      - q-plant-network

